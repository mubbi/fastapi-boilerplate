name: fastapi-boilerplate

# ──────────────────────────────────────────────────────────────────
# Local development stack.
# Use `make setup ENV=local` (preferred) or `docker compose up`.
# Test stack lives in `docker-compose.test.yml` — never share state.
#
# Hardening: every service sets `no-new-privileges`; the app services
# (built from docker/Dockerfile, non-root) also drop all Linux capabilities.
# ──────────────────────────────────────────────────────────────────

x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: fastapi-boilerplate:local

x-app-env: &app-env
  APP_ENV: local
  DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:18-alpine
    container_name: fb_postgres
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      # PG 18+ images expect a single mount at /var/lib/postgresql (not .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: fb_redis
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: fb_mailpit
    security_opt:
      - no-new-privileges:true
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  api:
    <<: [*app-build, *app-security]
    container_name: fb_api
    environment:
      <<: *app-env
      SERVICE_ROLE: web
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  worker:
    <<: [*app-build, *app-security]
    container_name: fb_worker
    environment:
      <<: *app-env
      SERVICE_ROLE: worker
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  beat:
    <<: [*app-build, *app-security]
    container_name: fb_beat
    environment:
      <<: *app-env
      SERVICE_ROLE: beat
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
